apiVersion: apps/v1
kind: Deployment
metadata:
  name: stash-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stash-api
  template:
    metadata:
      labels:
        app: stash-api
    spec:
      containers:
        - name: stash-api
          image: stash-api:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: stash-api-config
            - secretRef:
                name: stash-api-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"