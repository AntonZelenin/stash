apiVersion: v1
kind: ConfigMap
metadata:
  name: stash-api-config
data:
  PLATFORM: "local"
  ENVIRONMENT: "local"
  LOG_LEVEL: "INFO"
  TRACING_ENABLED: "false"
  VALKEY_URL: "redis://host.docker.internal:6379"
  S3_ENDPOINT_URL: "http://host.docker.internal:9000"
  S3_BUCKET: "stash"
  CORS_ALLOWED_ORIGINS: '["http://localhost:8080", "http://127.0.0.1:8080"]'