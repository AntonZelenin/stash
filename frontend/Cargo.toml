[workspace]
resolver = "2"
members = [
    "packages/analytics",
    "packages/api",
    "packages/ui",
    "packages/web",
    "packages/desktop",
    "packages/mobile",
]

[workspace.dependencies]
dioxus = { version = "0.7.1", features = ["router"] }
base64 = "0.22"

# workspace
analytics = { path = "packages/analytics" }
api = { path = "packages/api" }
ui = { path = "packages/ui" }

