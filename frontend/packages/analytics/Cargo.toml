[package]
name = "analytics"
version = "0.1.0"
edition = "2024"

# Product analytics events sent straight to PostHog (never through the
# Stash API): typed events, the session clock, and a bounded queue with a
# time-limited sender. No Dioxus; `ui` wires it into the app.

[dependencies]
# Same client the `api` crate uses: fetch on wasm, hyper natively.
reqwest = "0.12"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The send timeout, on every target (see `api`'s note in `ui`).
futures-timer = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3", features = ["wasm-bindgen"] }
