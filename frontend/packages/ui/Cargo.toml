[package]
name = "ui"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { workspace = true }
api = { workspace = true }
base64 = { workspace = true }
# Runtime-agnostic async timer (used to debounce search). Native targets use
# its built-in timer thread; the browser has no threads, so wasm switches
# it to JS timers via `wasm-bindgen` below.
futures-timer = "3"
# Showing item dates in the user's local time zone. Native targets read the
# OS time zone; wasm reads the browser's via `wasmbind` below.
# `unstable-locales` gives month names in the UI language.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "unstable-locales"] }
# Translations (Fluent); see src/i18n.rs.
dioxus-i18n = "0.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3", features = ["wasm-bindgen"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "unstable-locales", "wasmbind"] }

