[package]
name = "ui"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { workspace = true }
api = { workspace = true }
base64 = { workspace = true }
# Runtime-agnostic async timer (used to debounce search). Native targets use
# its built-in timer thread; the browser has no threads, so wasm switches
# it to JS timers via `wasm-bindgen` below.
futures-timer = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3", features = ["wasm-bindgen"] }

