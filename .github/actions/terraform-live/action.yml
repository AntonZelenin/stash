name: Terraform init (live)
description: >
  Installs Terraform and initializes infra/terraform/live against its remote
  state, with the variables CI passes it. Needs AWS credentials, and the
  repository variables AWS_REGION, TF_STATE_BUCKET, TF_STATE_KEY,
  STASH_ENVIRONMENT and LAMBDA_PERMISSIONS_BOUNDARY_ARN (optionally TF_VARS)
  in the job's environment.

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
        # Plain terraform, so its output can be piped and redirected.
        terraform_wrapper: false

    - name: Terraform init
      shell: bash
      working-directory: infra/terraform/live
      run: |
        set -euo pipefail
        missing=0
        for name in AWS_REGION TF_STATE_BUCKET TF_STATE_KEY STASH_ENVIRONMENT LAMBDA_PERMISSIONS_BOUNDARY_ARN; do
          if [ -z "${!name:-}" ]; then
            echo "::error::Repository variable $name is not set (see docs/deployment.md, one-time setup)."
            missing=1
          fi
        done
        [ "$missing" = 0 ]

        # Anything else live/ should get, as HCL (e.g. alarm_email); the
        # repository variable TF_VARS, not a committed tfvars file.
        printf '%s\n' "${TF_VARS:-}" > ci.auto.tfvars

        terraform init -input=false -no-color \
          -backend-config="bucket=$TF_STATE_BUCKET" \
          -backend-config="key=$TF_STATE_KEY" \
          -backend-config="region=$AWS_REGION"
