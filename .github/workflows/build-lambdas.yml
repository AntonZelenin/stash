# Builds every Lambda package, each in its own job, into an artifact
# lambda-<function> holding build/lambda/<function>.zip, where Terraform
# (infra/terraform/live) expects it. Terraform never builds anything: it
# deploys these zips and redeploys a function only when its zip's hash
# changes.
name: Build Lambda packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.function }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        function: [api, thumbnailer, image_analyzer, document_analyzer, embedding_worker, migrations]
    steps:
      - uses: actions/checkout@v5

      # The Lambda runtime's version; the wheels are resolved for Linux
      # arm64 whatever the runner is.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/**/pyproject.toml

      - name: Build
        run: python scripts/build_lambda_packages.py ${{ matrix.function }}

      - name: Hash
        run: |
          sha256sum "build/lambda/${{ matrix.function }}.zip" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-${{ matrix.function }}
          path: build/lambda/${{ matrix.function }}.zip
          if-no-files-found: error
          retention-days: 7
          # Already compressed.
          compression-level: 0
