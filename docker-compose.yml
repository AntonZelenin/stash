services:
  postgres:
    # PostgreSQL 16 with the pgvector extension (semantic search).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stash}
      POSTGRES_DB: ${POSTGRES_DB:-stash}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stash}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket the API/worker use, so a fresh (or wiped)
  # MinIO volume works without any manual setup. Idempotent.
  minio-init:
    # The server image ships the `mc` client (the standalone minio/mc image
    # is no longer publicly pullable).
    image: minio/minio:latest
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-stash}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
      && mc mb --ignore-existing local/$$S3_BUCKET"
    depends_on:
      minio:
        condition: service_healthy

  # Local tracing backend: every backend service exports its spans here
  # over OTLP/HTTP (see stash_shared.tracing). UI: http://localhost:16686.
  # Traces are kept in memory, so they're gone after a restart.
  jaeger:
    image: jaegertracing/jaeger:latest
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      # OTLP/HTTP, for services run outside Docker.
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"

  api:
    build:
      context: ./backend
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stash}:${POSTGRES_PASSWORD:-stash}@postgres:5432/${POSTGRES_DB:-stash}
      # Logging (see stash_shared.log): PLATFORM picks the format, ENVIRONMENT labels it.
      PLATFORM: ${PLATFORM:-local}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Tracing (see stash_shared.tracing): spans go to Jaeger over OTLP.
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT:-http://jaeger:4318}
      CORS_ALLOWED_ORIGINS: '["http://localhost:${FRONTEND_PORT:-8080}", "http://127.0.0.1:${FRONTEND_PORT:-8080}"]'
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-stash}
      # Search queries are embedded with the same model as item text.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      SEARCH_MAX_COSINE_DISTANCE: ${SEARCH_MAX_COSINE_DISTANCE:-0.8}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      jaeger:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  # First image-processing stage: makes thumbnails and hands images on to
  # content_analyzer. Same image/package as content_analyzer (they share the
  # worker, storage and DB code), different entrypoint, scaled separately.
  thumbnailer:
    build:
      context: ./backend
      dockerfile: content_analyzer/Dockerfile
    command: ["python", "-m", "content_analyzer.thumbnail_main"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stash}:${POSTGRES_PASSWORD:-stash}@postgres:5432/${POSTGRES_DB:-stash}
      # Logging (see stash_shared.log): PLATFORM picks the format, ENVIRONMENT labels it.
      PLATFORM: ${PLATFORM:-local}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Tracing (see stash_shared.tracing): spans go to Jaeger over OTLP.
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT:-http://jaeger:4318}
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-stash}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      jaeger:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  # Describes analyzable uploaded files (documents, books, text) via OpenAI.
  # Same image/package as content_analyzer, different entrypoint, like the
  # thumbnailer.
  document_analyzer:
    build:
      context: ./backend
      dockerfile: content_analyzer/Dockerfile
    command: ["python", "-m", "content_analyzer.document_main"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stash}:${POSTGRES_PASSWORD:-stash}@postgres:5432/${POSTGRES_DB:-stash}
      # Logging (see stash_shared.log): PLATFORM picks the format, ENVIRONMENT labels it.
      PLATFORM: ${PLATFORM:-local}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Tracing (see stash_shared.tracing): spans go to Jaeger over OTLP.
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT:-http://jaeger:4318}
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-stash}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      DOCUMENT_ANALYSIS_MAX_CHARS: ${DOCUMENT_ANALYSIS_MAX_CHARS:-24000}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      jaeger:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  # Turns items' searchable text into embeddings for semantic search.
  # Same image/package as content_analyzer, different entrypoint.
  embedding_worker:
    build:
      context: ./backend
      dockerfile: content_analyzer/Dockerfile
    command: ["python", "-m", "content_analyzer.embedding_main"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stash}:${POSTGRES_PASSWORD:-stash}@postgres:5432/${POSTGRES_DB:-stash}
      # Logging (see stash_shared.log): PLATFORM picks the format, ENVIRONMENT labels it.
      PLATFORM: ${PLATFORM:-local}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Tracing (see stash_shared.tracing): spans go to Jaeger over OTLP.
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT:-http://jaeger:4318}
      VALKEY_URL: redis://valkey:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      jaeger:
        condition: service_started

  content_analyzer:
    build:
      context: ./backend
      dockerfile: content_analyzer/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stash}:${POSTGRES_PASSWORD:-stash}@postgres:5432/${POSTGRES_DB:-stash}
      # Logging (see stash_shared.log): PLATFORM picks the format, ENVIRONMENT labels it.
      PLATFORM: ${PLATFORM:-local}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Tracing (see stash_shared.tracing): spans go to Jaeger over OTLP.
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT:-http://jaeger:4318}
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-stash}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      jaeger:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: packages/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    volumes:
      # Live source, so dx serve's watcher picks up host edits without a
      # rebuild. frontend_target is a separate named volume shadowing
      # /app/target specifically: it keeps the container's own Linux build
      # cache (faster incremental rebuilds) without ever mixing in the
      # host's target/, which — on a non-Linux host — holds artifacts built
      # for the wrong OS/ABI.
      - ./frontend:/app
      - frontend_target:/app/target
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  valkey_data:
  minio_data:
  frontend_target:
