[project]
name = "stash-content-analyzer"
version = "0.1.0"
description = "Stash content-analyzer processing worker"
requires-python = ">=3.14"
dependencies = [
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "boto3>=1.34",
    "openai>=1.66",
    "pillow>=11.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_analyzer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
