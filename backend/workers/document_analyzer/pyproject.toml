[project]
name = "stash-document-analyzer"
version = "0.1.0"
description = "Stash document-analyzer worker (DOCUMENT_ANALYSIS_JOBS)"
requires-python = ">=3.14"
# Needs `stash-shared` (../../shared) and `stash-worker-core` (../core)
# installed alongside, by path (no index/workspace); see the Dockerfile.
dependencies = [
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "openai>=1.66",
    "pypdf>=5.0",
    "striprtf>=0.0.26",
    "defusedxml>=0.7",
    "charset-normalizer>=3.3",
]

[project.optional-dependencies]
# Includes what `stash_worker_core.testing` (the shared fakes) needs.
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_analyzer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
