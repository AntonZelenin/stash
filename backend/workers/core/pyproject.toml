[project]
name = "stash-worker-core"
version = "0.1.0"
description = "What every Stash processing worker is built on (Worker, runtimes, item SQL, S3)"
requires-python = ">=3.14"
# Needs `stash-shared` (../../shared) installed alongside; like every local
# package here it's installed by path, not listed (no index/workspace).
dependencies = [
    "pydantic-settings>=2.4",
    # [asyncio]: greenlet, which the async engine needs (2.1 stopped
    # installing it by default). <2.1: what the app is tested on, and what
    # opentelemetry-instrumentation-sqlalchemy supports so far.
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29",
    "boto3>=1.34",
    "openai>=1.66",
]

[project.optional-dependencies]
# `stash_worker_core.testing` (fakes, SQLite schema, the `engine` fixture),
# for the workers' tests as well as this package's.
testing = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]
test = ["stash-worker-core[testing]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stash_worker_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
