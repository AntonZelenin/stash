[project]
name = "stash-embedding-worker"
version = "0.1.0"
description = "Stash embedding worker (EMBEDDING_JOBS)"
requires-python = ">=3.14"
# Needs `stash-shared` (../../shared) and `stash-worker-core` (../core)
# installed alongside, by path (no index/workspace); see the Dockerfile.
dependencies = [
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "openai>=1.66",
]

[project.optional-dependencies]
# Includes what `stash_worker_core.testing` (the shared fakes) needs.
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedding_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
