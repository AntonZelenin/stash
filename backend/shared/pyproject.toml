[project]
name = "stash-shared"
version = "0.1.0"
description = "Code shared between the Stash API and the content-analyzer worker"
requires-python = ">=3.14"
dependencies = [
    "redis>=5.0",
    "openai>=1.66",
    # Distributed tracing (`stash_shared.tracing`): OTLP/HTTP export, plus
    # the instrumentations every service uses (S3 via botocore, SQLAlchemy).
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-botocore>=0.51b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
]

[project.optional-dependencies]
# Structured logging via AWS Lambda Powertools when PLATFORM=aws (see
# `stash_shared.log`); standard logging is used everywhere else.
aws = ["aws-lambda-powertools>=3.0"]

test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stash_shared"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
