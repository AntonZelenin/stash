[project]
name = "stash-shared"
version = "0.1.0"
description = "Code shared between the Stash API and the content-analyzer worker"
requires-python = ">=3.14"
dependencies = [
    "redis>=5.0",
    "openai>=1.66",
]

[project.optional-dependencies]
# Structured logging via AWS Lambda Powertools when PLATFORM=aws (see
# `stash_shared.log`); standard logging is used everywhere else.
aws = ["aws-lambda-powertools>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stash_shared"]
