[project]
name = "stash-shared"
version = "0.1.0"
description = "Code shared between the Stash API and the content-analyzer worker"
requires-python = ">=3.14"
dependencies = [
    "redis>=5.0",
    "openai>=1.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stash_shared"]
