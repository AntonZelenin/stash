openapi: 3.1.0

info:
  title: Stash API
  version: 0.1.0

paths:
  /users:
    post:
      summary: Create user
      operationId: createUser

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72

      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    format: uuid

        "409":
          description: User already exists

        "422":
          description: Invalid request

  /login:
    post:
      summary: Log in
      operationId: login

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string

      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

        "401":
          description: Invalid credentials

  /refresh:
    post:
      summary: Refresh an access token
      operationId: refreshToken

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string

      responses:
        "200":
          description: Refresh successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

        "401":
          description: Invalid refresh token

  /items/text:
    post:
      summary: Save text content
      operationId: createTextItem

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  minLength: 1

      responses:
        "202":
          description: Item accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCreated"

        "401":
          description: Unauthorized

        "422":
          description: Invalid content

  /items/image:
    post:
      summary: Save image content
      operationId: createImageItem

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  maxLength: 10485760
                text:
                  description: >-
                    Optional caption stored on the same item (returned as its
                    `text`, and searchable). Blank is treated as absent.
                  type: string
            encoding:
              file:
                contentType: image/png, image/jpeg, image/gif, image/webp

      responses:
        "202":
          description: Item accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCreated"

        "401":
          description: Unauthorized

        "422":
          description: Invalid content (empty file, unsupported image type, or file too large)

  /items/{item_id}:
    delete:
      summary: Delete an item
      description: >-
        Permanently deletes the item, everything stored with it (text,
        caption, description, image file), and removes it from search.
      operationId: deleteItem

      security:
        - bearerAuth: []

      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        "204":
          description: Item deleted

        "401":
          description: Unauthorized

        "404":
          description: No such item for the current user

        "422":
          description: Invalid item id

  /items:
    get:
      summary: List saved items
      operationId: listItems

      security:
        - bearerAuth: []

      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a previous response's `next_cursor`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30

      responses:
        "200":
          description: The current user's items, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListItemsResponse"

        "401":
          description: Unauthorized

        "422":
          description: Invalid cursor

  /search:
    post:
      summary: Search saved content
      operationId: searchItems

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  minLength: 1
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20

      responses:
        "200":
          description: >-
            The current user's items whose description matches every word of
            `query` (each word also matching as a prefix, so partial words
            work), best match first. Same item shape as `GET /items`.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ListedItem"

        "401":
          description: Unauthorized

        "422":
          description: Invalid request

components:
  schemas:
    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    ItemCreated:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed

    ListedItem:
      type: object
      required:
        - id
        - type
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - text
            - link
            - image
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
        created_at:
          type: string
          format: date-time
        text:
          description: >-
            The note/link text for `type == text`/`link`; for `type == image`,
            the optional caption the user added.
          type:
            - string
            - "null"
        download_url:
          description: >-
            Temporary, pre-signed download URL. Set only for `type == image`,
            and only valid for a limited time.
          type:
            - string
            - "null"

    ListItemsResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListedItem"
        next_cursor:
          description: Opaque cursor for the next page, or null when there is no more data.
          type:
            - string
            - "null"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
