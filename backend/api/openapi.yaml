openapi: 3.1.0

info:
  title: Stash API
  version: 0.1.0

paths:
  /users:
    post:
      summary: Create user
      operationId: createUser

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72

      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    format: uuid

        "409":
          description: User already exists

        "422":
          description: Invalid request

  /login:
    post:
      summary: Log in
      operationId: login

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string

      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

        "401":
          description: Invalid credentials

  /refresh:
    post:
      summary: Refresh an access token
      operationId: refreshToken

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string

      responses:
        "200":
          description: Refresh successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

        "401":
          description: Invalid refresh token

  /users/me/password:
    post:
      summary: Change the current user's password
      description: >
        Requires the current password. Ends every existing session of the
        user (all access and refresh tokens stop working) and returns a new
        token pair so the caller stays signed in.
      operationId: changePassword

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
                  maxLength: 72

      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

        "401":
          description: Unauthorized

        "422":
          description: >
            The current password is incorrect (reported as a validation error
            on `current_password`), or the new password is invalid.

  /items/text:
    post:
      summary: Save text content
      operationId: createTextItem

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  minLength: 1
                tags:
                  description: >-
                    Tag names to put on the new item (existing tags reused
                    case-insensitively, missing ones created); at most 20,
                    each 1-50 characters.
                  type: array
                  maxItems: 20
                  items:
                    type: string

      responses:
        "202":
          description: Item accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCreated"

        "401":
          description: Unauthorized

        "422":
          description: Invalid content

  /items/image:
    post:
      summary: Save image content
      operationId: createImageItem

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  maxLength: 10485760
                text:
                  description: >-
                    Optional caption stored on the same item (returned as its
                    `text`, and searchable). Blank is treated as absent.
                  type: string
                tags:
                  description: >-
                    Tag names to put on the new item (existing tags reused
                    case-insensitively, missing ones created). Repeat the
                    field once per tag; at most 20, each 1-50 characters.
                  type: array
                  maxItems: 20
                  items:
                    type: string
            encoding:
              file:
                contentType: image/png, image/jpeg, image/gif, image/webp

      responses:
        "202":
          description: Item accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCreated"

        "401":
          description: Unauthorized

        "422":
          description: Invalid content (empty file, unsupported image type, or file too large)

  /items/file:
    post:
      summary: Save a file
      description: >-
        Stores any file as-is, up to 50 MB. Analyzable formats (PDF,
        DOCX/XLSX/PPTX, ODT/ODS/ODP, RTF, EPUB, FB2, FB2.ZIP and the
        text/data formats) are created `pending` and analyzed asynchronously
        into a searchable description; everything else is created already
        `completed`. Recognized formats — documents (PDF,
        Office, OpenDocument, RTF, iWork), books (EPUB, FB2, FB2.ZIP,
        MOBI/AZW/AZW3, DjVu), text/data (TXT, MD, CSV, TSV, JSON, YAML, XML,
        HTML, LOG) and ZIP — keep their real content type, taken from the
        filename's extension and verified against the content. Any other
        file, or one whose content doesn't match its extension, is stored as
        `application/octet-stream`. The client's content type is ignored.
      operationId: createFileItem

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  maxLength: 52428800
                text:
                  description: >-
                    Optional caption stored on the same item (returned as its
                    `text`, and searchable). Blank is treated as absent.
                  type: string
                tags:
                  description: >-
                    Tag names to put on the new item (existing tags reused
                    case-insensitively, missing ones created). Repeat the
                    field once per tag; at most 20, each 1-50 characters.
                  type: array
                  maxItems: 20
                  items:
                    type: string

      responses:
        "202":
          description: Item created (`pending` if it will be analyzed, otherwise `completed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCreated"

        "401":
          description: Unauthorized

        "422":
          description: Invalid content (empty file, or file larger than 50 MB)

  /tags:
    get:
      summary: List or search the current user's tags
      description: >-
        Tags are per user. Returns the user's tags whose name contains
        `query` (case-insensitive; all of them if empty), names starting
        with it first, then alphabetically.
      operationId: listTags
      tags: [tags]

      security:
        - bearerAuth: []

      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            default: ""
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50

      responses:
        "200":
          description: Matching tags
          content:
            application/json:
              schema:
                type: object
                required:
                  - tags
                properties:
                  tags:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"

        "401":
          description: Unauthorized

  /items/{item_id}/tags:
    post:
      summary: Assign a tag to an item
      description: >-
        Assigns the user's tag called `name` to the item, reusing the
        user's existing tag with that name (compared case-insensitively,
        after trimming and collapsing whitespace) or creating it. Assigning
        an already-assigned tag is a no-op. Returns the tag.
      operationId: assignTag
      tags: [tags]

      security:
        - bearerAuth: []

      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  description: 1-50 characters after trimming.
                  type: string

      responses:
        "200":
          description: The assigned tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"

        "401":
          description: Unauthorized

        "404":
          description: No such item for the current user

        "422":
          description: Invalid tag name

  /items/{item_id}/tags/{tag_id}:
    delete:
      summary: Remove a tag from an item
      description: >-
        Removes the tag from the item (a no-op if it wasn't assigned). The
        tag itself stays in the user's tag list.
      operationId: removeTag
      tags: [tags]

      security:
        - bearerAuth: []

      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tag_id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        "204":
          description: Tag removed

        "401":
          description: Unauthorized

        "404":
          description: No such item for the current user

  /items/{item_id}/favorite:
    put:
      summary: Mark an item as a favorite
      description: Idempotent.
      operationId: markFavorite
      tags: [items]

      security:
        - bearerAuth: []

      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        "204":
          description: Marked as favorite

        "401":
          description: Unauthorized

        "404":
          description: No such item for the current user

    delete:
      summary: Unmark an item as a favorite
      description: Idempotent.
      operationId: unmarkFavorite
      tags: [items]

      security:
        - bearerAuth: []

      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        "204":
          description: No longer a favorite

        "401":
          description: Unauthorized

        "404":
          description: No such item for the current user

  /items/{item_id}:
    delete:
      summary: Delete an item
      description: >-
        Permanently deletes the item, everything stored with it (text,
        caption, description, image file), and removes it from search.
      operationId: deleteItem

      security:
        - bearerAuth: []

      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        "204":
          description: Item deleted

        "401":
          description: Unauthorized

        "404":
          description: No such item for the current user

        "422":
          description: Invalid item id

    patch:
      summary: Edit an item
      description: >-
        Changes the item's user-editable content in place; only the fields
        sent are changed. The item keeps its id. A note's or link's new
        text is classified again exactly as on creation, so the item can
        turn from `text` into `link` or back. A file's new filename only
        changes the name it's shown and downloaded under; the stored file
        itself is untouched. When the searchable text changes, the item is
        embedded again, so search reflects the edit a few seconds later.
      operationId: updateItem
      tags: [items]

      security:
        - bearerAuth: []

      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemRequest"

      responses:
        "200":
          description: The item as updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListedItem"

        "401":
          description: Unauthorized

        "404":
          description: No such item for the current user

        "422":
          description: >-
            The edit doesn't apply to this item or would leave it invalid:
            an empty note or link, an empty filename, a filename for
            anything but a file, or an unknown field.

  /items:
    get:
      summary: List saved items
      operationId: listItems

      security:
        - bearerAuth: []

      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a previous response's `next_cursor`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: type
          in: query
          required: false
          description: Only items of this type.
          schema:
            $ref: "#/components/schemas/ItemType"
        - name: tag_id
          in: query
          required: false
          description: >-
            Only items carrying this tag. Repeatable: with several, an item
            must carry all of them.
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: favorite
          in: query
          required: false
          description: If true, only favorite items.
          schema:
            type: boolean
            default: false

      responses:
        "200":
          description: The current user's items, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListItemsResponse"

        "401":
          description: Unauthorized

        "422":
          description: Invalid cursor

  /search:
    post:
      summary: Search saved content
      operationId: searchItems

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  minLength: 1
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
                type:
                  description: Only items of this type (same as `GET /items`).
                  $ref: "#/components/schemas/ItemType"
                tag_ids:
                  description: Only items carrying all of these tags (same as `GET /items`).
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: uuid
                favorite:
                  description: If true, only favorite items (same as `GET /items`).
                  type: boolean
                  default: false

      responses:
        "200":
          description: >-
            Semantic search: the current user's items closest in meaning to
            `query` (by embedding cosine similarity, across languages),
            most similar first; clearly unrelated items are left out. Items
            whose content hasn't been embedded yet (a few seconds after
            saving/analysis) aren't found. Same item shape as `GET /items`.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ListedItem"

        "401":
          description: Unauthorized

        "422":
          description: Invalid request

        "503":
          description: Search is temporarily unavailable (the query couldn't be embedded)

components:
  schemas:
    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    ItemCreated:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed

    ItemType:
      type: string
      enum:
        - text
        - link
        - image
        - file

    Tag:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    ListedFile:
      type: object
      required:
        - filename
        - content_type
        - size_bytes
      properties:
        filename:
          description: The original filename, as uploaded.
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer

    ListedItem:
      type: object
      required:
        - id
        - type
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - text
            - link
            - image
            - file
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
        created_at:
          type: string
          format: date-time
        text:
          description: >-
            The note/link text for `type == text`/`link`; for `type == image`
            or `file`, the optional caption the user added.
          type:
            - string
            - "null"
        download_url:
          description: >-
            Temporary, pre-signed download URL. Set only for `type == image`
            or `file`, and only valid for a limited time. For files:
            PDFs, plain text and JSON open in the browser, everything else
            is downloaded, either way under the original filename.
          type:
            - string
            - "null"
        file:
          description: Set only for `type == file`.
          oneOf:
            - $ref: "#/components/schemas/ListedFile"
            - type: "null"
        tags:
          description: The item's tags, sorted by name.
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        is_favorite:
          type: boolean
        thumbnail_url:
          description: >-
            Temporary, pre-signed URL of a small WebP version of the image,
            meant for display in lists. Set only for `type == image`, once
            the thumbnail has been generated (shortly after upload); until
            then, or if generation failed, it is null and clients should
            fall back to `download_url`.
          type:
            - string
            - "null"

    UpdateItemRequest:
      type: object
      additionalProperties: false
      properties:
        text:
          description: >-
            For `text` and `link` items, the whole text (must not be blank;
            the type is detected again). For `image` and `file` items, the
            caption; blank removes it.
          type: string
          maxLength: 100000
        filename:
          description: >-
            `file` items only: the name shown and used for downloads.
            Must not be blank.
          type: string
          maxLength: 1000

    ListItemsResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListedItem"
        next_cursor:
          description: Opaque cursor for the next page, or null when there is no more data.
          type:
            - string
            - "null"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
