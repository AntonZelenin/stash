openapi: 3.1.0

info:
  title: Stash API
  version: 0.1.0

paths:
  /users:
    post:
      summary: Create user
      operationId: createUser

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72

      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    format: uuid

        "409":
          description: User already exists

        "422":
          description: Invalid request

  /login:
    post:
      summary: Log in
      operationId: login

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string

      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

        "401":
          description: Invalid credentials

  /refresh:
    post:
      summary: Refresh an access token
      operationId: refreshToken

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string

      responses:
        "200":
          description: Refresh successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

        "401":
          description: Invalid refresh token

  /items/text:
    post:
      summary: Save text content
      operationId: createTextItem

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string

      responses:
        "202":
          description: Item accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCreated"

        "401":
          description: Unauthorized

        "422":
          description: Invalid content

  /items/image:
    post:
      summary: Save image content
      operationId: createImageItem

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary

      responses:
        "202":
          description: Item accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCreated"

        "401":
          description: Unauthorized

        "422":
          description: Invalid content

  /search:
    post:
      summary: Search saved content
      operationId: searchItems

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  minLength: 1
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20

      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - type
                      properties:
                        id:
                          type: string
                          format: uuid
                        type:
                          type: string
                          enum:
                            - text
                            - image
                        text:
                          type:
                            - string
                            - "null"
                        description:
                          type:
                            - string
                            - "null"
                        tags:
                          type: array
                          items:
                            type: string

        "401":
          description: Unauthorized

components:
  schemas:
    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    ItemCreated:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
