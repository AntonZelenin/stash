openapi: 3.1.0

info:
  title: Stash API
  version: 0.1.0

paths:
  /users:
    post:
      summary: Create user
      operationId: createUser

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72

      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    format: uuid

        "409":
          description: User already exists

        "422":
          description: Invalid request

  /login:
    post:
      summary: Log in
      operationId: login

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string

      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

        "401":
          description: Invalid credentials

  /refresh:
    post:
      summary: Refresh an access token
      operationId: refreshToken

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string

      responses:
        "200":
          description: Refresh successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

        "401":
          description: Invalid refresh token

  /users/me:
    get:
      summary: Get the current user's account
      operationId: getCurrentUser

      security:
        - bearerAuth: []

      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - email
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email

        "401":
          description: Unauthorized

  /users/me/password:
    post:
      summary: Change the current user's password
      description: >
        Requires the current password. Ends every existing session of the
        user (all access and refresh tokens stop working) and returns a new
        token pair so the caller stays signed in.
      operationId: changePassword

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
                  maxLength: 72

      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

        "401":
          description: Unauthorized

        "422":
          description: >
            The current password is incorrect (reported as a validation error
            on `current_password`), or the new password is invalid.

  /items/text:
    post:
      summary: Save text content
      description: >-
        Saves a note or link. Text that is only a URL is saved as a `link`,
        text without URLs as `text`. Text mixing text and URLs gets the
        chosen `type` (default `text`).
      operationId: createTextItem

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  minLength: 1
                tags:
                  description: >-
                    Tag names to put on the new item (existing tags reused
                    case-insensitively, missing ones created); at most 20,
                    each 1-50 characters.
                  type: array
                  maxItems: 20
                  items:
                    type: string
                type:
                  $ref: "#/components/schemas/TextItemType"

      responses:
        "202":
          description: Item accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCreated"

        "401":
          description: Unauthorized

        "422":
          description: Invalid content

  /uploads:
    post:
      summary: Start an image or file upload
      description: >-
        Step 1 of saving an image or file. Images and files are uploaded by
        the client straight to object storage, never through the API:


        1. `POST /uploads` with what is about to be uploaded. The API
           validates it, generates the new item's id and its storage key
           (`users/{user_id}/images|files/{item_id}[.ext]`; never chosen by
           the client, never containing the filename), and returns a
           short-lived pre-signed upload URL for exactly that key, content
           type and size.

        2. Send the file's bytes as the whole request body to `upload.url`
           with `upload.method`, setting exactly `upload.headers`. Storage
           rejects any other key, content type or size, and requests after
           `expires_at`.

        3. `POST /uploads/{upload_id}/finalize` to create the item.


        Until it's finalized, an upload is not an item: it isn't listed,
        searched or processed. Uploads that are never finalized are kept as
        pending (nothing cleans them up yet).


        Images: `content_type` must be PNG, JPEG, GIF or WebP, up to
        100 MB; the uploaded content must be that type.


        Files: any file up to 50 MB. Analyzable formats (PDF,
        DOCX/XLSX/PPTX, ODT/ODS/ODP, RTF, EPUB, FB2, FB2.ZIP and the
        text/data formats) are created `pending` and analyzed
        asynchronously into a searchable description; everything else is
        created already `completed`. Recognized formats — documents (PDF,
        Office, OpenDocument, RTF, iWork), books (EPUB, FB2, FB2.ZIP,
        MOBI/AZW/AZW3, DjVu), text/data (TXT, MD, CSV, TSV, JSON, YAML, XML,
        HTML, LOG) and ZIP — keep their real content type, taken from the
        filename's extension and verified against the content on finalize.
        Any other file, or one whose content doesn't match its extension,
        is stored as `application/octet-stream`. The client's content type
        is ignored for files.
      operationId: startUpload

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartUploadRequest"

      responses:
        "201":
          description: Upload authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStarted"

        "401":
          description: Unauthorized

        "422":
          description: >-
            Invalid request: empty file, file too large, unsupported image
            type, invalid tags, or unknown fields (such as a storage key).

  /uploads/{upload_id}/finalize:
    post:
      summary: Finalize an upload, creating its item
      description: >-
        Step 3 of saving an image or file (see `POST /uploads`): once the
        upload to storage succeeded, creates the item (its id is the
        `upload_id`) with the caption and tags given when the upload
        started, and starts its processing. The uploaded content is checked
        first: if it's empty, too large or (for images) not the declared
        type, the upload is discarded and no item is created.


        Idempotent: finalizing an upload that already became an item
        returns that item again.
      operationId: finalizeUpload

      security:
        - bearerAuth: []

      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        "202":
          description: >-
            Item created (images, and files that will be analyzed:
            `pending`; other files: `completed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCreated"

        "401":
          description: Unauthorized

        "404":
          description: >-
            No such upload started by this user (someone else's is
            indistinguishable from a missing one), or it was discarded.

        "409":
          description: >-
            The file isn't in storage yet. The upload stays pending: upload
            it, then finalize again.

        "422":
          description: >-
            The uploaded content is invalid (empty file, file too large, or
            not the declared image type); the upload was discarded.

  /tags:
    get:
      summary: List or search the current user's tags
      description: >-
        Tags are per user. Returns the user's tags whose name contains
        `query` (case-insensitive; all of them if empty), names starting
        with it first, then alphabetically.
      operationId: listTags
      tags: [tags]

      security:
        - bearerAuth: []

      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            default: ""
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50

      responses:
        "200":
          description: Matching tags
          content:
            application/json:
              schema:
                type: object
                required:
                  - tags
                properties:
                  tags:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"

        "401":
          description: Unauthorized

  /tags/suggestions:
    get:
      summary: Suggest existing tags to add
      description: >-
        Up to `limit` of the current user's tags, for offering when a tag is
        being added: the most recently used first (filling at most half the
        list, rounded up), then the most frequently used (by how many items
        carry them), without duplicates. Recently used tags fill any
        remaining places. Empty if the user has no tags.
      operationId: suggestTags
      tags: [tags]

      security:
        - bearerAuth: []

      parameters:
        - name: item_id
          in: query
          required: false
          description: Leave out the tags already on this item.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 6

      responses:
        "200":
          description: Suggested tags, best first
          content:
            application/json:
              schema:
                type: object
                required:
                  - tags
                properties:
                  tags:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"

        "401":
          description: Unauthorized

        "404":
          description: Item not found

  /items/{item_id}/tags:
    post:
      summary: Assign a tag to an item
      description: >-
        Assigns the user's tag called `name` to the item, reusing the
        user's existing tag with that name (compared case-insensitively,
        after trimming and collapsing whitespace) or creating it. Assigning
        an already-assigned tag is a no-op. Returns the tag.
      operationId: assignTag
      tags: [tags]

      security:
        - bearerAuth: []

      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  description: 1-50 characters after trimming.
                  type: string

      responses:
        "200":
          description: The assigned tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"

        "401":
          description: Unauthorized

        "404":
          description: No such item for the current user

        "422":
          description: Invalid tag name

  /items/{item_id}/tags/{tag_id}:
    delete:
      summary: Remove a tag from an item
      description: >-
        Removes the tag from the item (a no-op if it wasn't assigned). If no
        other item uses the tag any more, the tag itself is deleted too.
      operationId: removeTag
      tags: [tags]

      security:
        - bearerAuth: []

      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tag_id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        "204":
          description: Tag removed

        "401":
          description: Unauthorized

        "404":
          description: No such item for the current user

  /items/{item_id}/favorite:
    put:
      summary: Mark an item as a favorite
      description: Idempotent.
      operationId: markFavorite
      tags: [items]

      security:
        - bearerAuth: []

      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        "204":
          description: Marked as favorite

        "401":
          description: Unauthorized

        "404":
          description: No such item for the current user

    delete:
      summary: Unmark an item as a favorite
      description: Idempotent.
      operationId: unmarkFavorite
      tags: [items]

      security:
        - bearerAuth: []

      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        "204":
          description: No longer a favorite

        "401":
          description: Unauthorized

        "404":
          description: No such item for the current user

  /items/delete:
    post:
      summary: Delete several items
      description: >-
        Deletes each listed item exactly as `DELETE /items/{item_id}` does,
        all in one transaction. Ids that aren't the current user's items
        (someone else's, missing, already deleted) are skipped, so the call
        succeeds for them too; repeated ids are fine.
      operationId: deleteItems

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteItemsRequest"

      responses:
        "204":
          description: Items deleted

        "401":
          description: Unauthorized

        "422":
          description: No ids, more than 100, or an invalid one

  /items/random:
    get:
      summary: Get a random item
      description: >-
        One of the current user's items, picked at random (for "Surprise
        me"). Consecutive calls may return the same item.
      operationId: getRandomItem
      tags: [items]

      security:
        - bearerAuth: []

      responses:
        "200":
          description: A random item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListedItem"

        "401":
          description: Unauthorized

        "404":
          description: The user has no items

  /items/{item_id}:
    get:
      summary: Get an item
      operationId: getItem
      tags: [items]

      security:
        - bearerAuth: []

      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        "200":
          description: The item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListedItem"

        "401":
          description: Unauthorized

        "404":
          description: No such item for the current user

        "422":
          description: Invalid item id

    delete:
      summary: Delete an item
      description: >-
        Permanently deletes the item, everything stored with it (text,
        caption, description, image file), and removes it from search. Its
        tags that no other item uses are deleted too.
      operationId: deleteItem

      security:
        - bearerAuth: []

      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        "204":
          description: Item deleted

        "401":
          description: Unauthorized

        "404":
          description: No such item for the current user

        "422":
          description: Invalid item id

    patch:
      summary: Edit an item
      description: >-
        Changes the item's user-editable content in place; only the fields
        sent are changed. The item keeps its id. A note's or link's type is
        resolved again from its resulting text exactly as on creation, so
        the item can turn from `text` into `link` or back; for text mixing
        text and URLs, `type` chooses (unset keeps the current type). A
        file's new filename only
        changes the name it's shown and downloaded under; the stored file
        itself is untouched. When the searchable text changes, the item is
        embedded again, so search reflects the edit a few seconds later.
      operationId: updateItem
      tags: [items]

      security:
        - bearerAuth: []

      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemRequest"

      responses:
        "200":
          description: The item as updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListedItem"

        "401":
          description: Unauthorized

        "404":
          description: No such item for the current user

        "422":
          description: >-
            The edit doesn't apply to this item or would leave it invalid:
            an empty note or link, an empty filename, a filename for
            anything but a file, a type for an image or file, or an
            unknown field.

  /items/counts:
    get:
      summary: Count the current user's items
      description: >-
        How many items the user has of each type (every type is present,
        zero if there are none) and how many are favorites. Covers the
        same items as listing without filters; computed on each request.
      operationId: countItems
      tags: [items]

      security:
        - bearerAuth: []

      responses:
        "200":
          description: Item counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCounts"

        "401":
          description: Unauthorized

  /items/years:
    get:
      summary: When the current user saved items, by year
      description: >-
        For each calendar year the user saved something in, the first and
        last time they did, oldest year first. Used by the date filter to
        offer only years with items. Times rather than year numbers because
        the server doesn't know the user's time zone: a client converts
        both times of each entry to its own time zone, and every year from
        the first's to the last's has items.
      operationId: savedYears
      tags: [items]

      security:
        - bearerAuth: []

      responses:
        "200":
          description: One entry per year with items
          content:
            application/json:
              schema:
                type: object
                required:
                  - years
                properties:
                  years:
                    type: array
                    items:
                      type: object
                      required:
                        - first_saved_at
                        - last_saved_at
                      properties:
                        first_saved_at:
                          type: string
                          format: date-time
                        last_saved_at:
                          type: string
                          format: date-time

        "401":
          description: Unauthorized

  /items:
    get:
      summary: List saved items
      operationId: listItems

      security:
        - bearerAuth: []

      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a previous response's `next_cursor`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: type
          in: query
          required: false
          description: Only items of this type.
          schema:
            $ref: "#/components/schemas/ItemType"
        - name: tag_id
          in: query
          required: false
          description: >-
            Only items carrying this tag. Repeatable: with several, an item
            must carry all of them.
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: favorite
          in: query
          required: false
          description: If true, only favorite items.
          schema:
            type: boolean
            default: false
        - name: created_from
          in: query
          required: false
          description: >-
            Only items saved at or after this time. With `created_before`,
            clients send the bounds of a year, month or day in the user's
            time zone. Must include a time zone offset.
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          required: false
          description: Only items saved before this time. Must include a time zone offset.
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          required: false
          description: >-
            `newest` or `oldest` first (by save time, pages with `cursor`;
            a cursor only continues a listing in the same order), or
            `random`: `limit` of the matching items in random order, a new
            shuffle each request, always without a next page (and it takes
            no cursor).
          schema:
            type: string
            enum: [newest, oldest, random]
            default: newest

      responses:
        "200":
          description: The current user's items, in `sort` order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListItemsResponse"

        "401":
          description: Unauthorized

        "422":
          description: Invalid cursor

  /search:
    post:
      summary: Search saved content
      description: >-
        Files and images whose filename contains every word of the query
        (case-insensitive; an exact filename first, then newest first) come
        first, followed by items whose content is closest in meaning to the
        query. An item appears only once, and at most `limit` items are
        returned in total. The filters apply to both.
      operationId: searchItems

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  minLength: 1
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
                type:
                  description: Only items of this type (same as `GET /items`).
                  $ref: "#/components/schemas/ItemType"
                tag_ids:
                  description: Only items carrying all of these tags (same as `GET /items`).
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: uuid
                favorite:
                  description: If true, only favorite items (same as `GET /items`).
                  type: boolean
                  default: false
                created_from:
                  description: Only items saved at or after this time (same as `GET /items`).
                  type: string
                  format: date-time
                created_before:
                  description: Only items saved before this time (same as `GET /items`).
                  type: string
                  format: date-time

      responses:
        "200":
          description: >-
            Semantic search: the current user's items closest in meaning to
            `query` (by embedding cosine similarity, across languages),
            most similar first; clearly unrelated items are left out. Items
            whose content hasn't been embedded yet (a few seconds after
            saving/analysis) aren't found. Same item shape as `GET /items`.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ListedItem"

        "401":
          description: Unauthorized

        "422":
          description: Invalid request

        "503":
          description: Search is temporarily unavailable (the query couldn't be embedded)

components:
  schemas:
    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    ItemCreated:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed

    StartUploadRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - size_bytes
      properties:
        type:
          type: string
          enum:
            - image
            - file
        size_bytes:
          description: Exact size of the file; the upload URL is signed for it.
          type: integer
          minimum: 1
        filename:
          description: >-
            The name downloads are saved under (any path is dropped); for
            files, also the name shown. Files: its extension picks the
            expected format. Never part of the storage key.
          type: string
          maxLength: 1000
        content_type:
          description: >-
            Images: `image/png`, `image/jpeg`, `image/gif` or `image/webp`;
            the content must match. Ignored for files.
          type: string
          maxLength: 255
        text:
          description: >-
            Optional caption stored on the new item (returned as its `text`,
            and searchable). Blank is treated as absent.
          type: string
          maxLength: 100000
        tags:
          description: >-
            Tag names to put on the new item (existing tags reused
            case-insensitively, missing ones created); at most 20, each 1-50
            characters.
          type: array
          maxItems: 20
          items:
            type: string

    UploadStarted:
      type: object
      required:
        - upload_id
        - upload
        - expires_at
      properties:
        upload_id:
          description: Finalize with it; also the id of the item it becomes.
          type: string
          format: uuid
        upload:
          type: object
          required:
            - url
            - method
            - headers
          properties:
            url:
              description: Temporary, pre-signed object storage URL.
              type: string
            method:
              type: string
              enum:
                - PUT
            headers:
              description: >-
                Headers to send with the upload, exactly as given (they're
                part of the signature).
              type: object
              additionalProperties:
                type: string
        expires_at:
          description: When `upload.url` stops accepting uploads.
          type: string
          format: date-time

    ItemType:
      type: string
      enum:
        - text
        - link
        - image
        - file

    ItemCounts:
      type: object
      required:
        - types
        - favorites
      properties:
        types:
          type: object
          required:
            - text
            - link
            - image
            - file
          properties:
            text:
              type: integer
              minimum: 0
            link:
              type: integer
              minimum: 0
            image:
              type: integer
              minimum: 0
            file:
              type: integer
              minimum: 0
        favorites:
          type: integer
          minimum: 0

    Tag:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    ListedFile:
      type: object
      required:
        - filename
        - content_type
        - size_bytes
      properties:
        filename:
          description: The original filename, as uploaded.
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer

    ListedItem:
      type: object
      required:
        - id
        - type
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - text
            - link
            - image
            - file
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
        created_at:
          type: string
          format: date-time
        text:
          description: >-
            The note/link text for `type == text`/`link`; for `type == image`
            or `file`, the optional caption the user added.
          type:
            - string
            - "null"
        download_url:
          description: >-
            Temporary, pre-signed download URL. Set only for `type == image`
            or `file`, and only valid for a limited time. Served under the
            original filename (for images, if one was uploaded). Images open
            in the browser; for files, PDFs, plain text and JSON do and
            everything else is downloaded.
          type:
            - string
            - "null"
        file:
          description: Set only for `type == file`.
          oneOf:
            - $ref: "#/components/schemas/ListedFile"
            - type: "null"
        tags:
          description: The item's tags, sorted by name.
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        is_favorite:
          type: boolean
        thumbnail_url:
          description: >-
            Temporary, pre-signed URL of a small WebP version of the image,
            meant for display in lists. Set only for `type == image`, once
            the thumbnail has been generated (shortly after upload); until
            then, or if generation failed, it is null and clients should
            fall back to `download_url`.
          type:
            - string
            - "null"

    TextItemType:
      description: >-
        The type for a note/link whose text mixes text and URLs. Ignored
        otherwise: text that is only a URL is always a `link`, text without
        URLs always `text`. A URL here is a whitespace-separated word
        (ignoring surrounding punctuation) that is an http(s) URL with a
        host.
      type: string
      enum:
        - text
        - link

    UpdateItemRequest:
      type: object
      additionalProperties: false
      properties:
        text:
          description: >-
            For `text` and `link` items, the whole text (must not be blank;
            the type is resolved again). For `image` and `file` items, the
            caption; blank removes it.
          type: string
          maxLength: 100000
        type:
          $ref: "#/components/schemas/TextItemType"
        filename:
          description: >-
            `file` items only: the name shown and used for downloads.
            Must not be blank.
          type: string
          maxLength: 1000

    DeleteItemsRequest:
      type: object
      additionalProperties: false
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid

    ListItemsResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListedItem"
        next_cursor:
          description: Opaque cursor for the next page, or null when there is no more data.
          type:
            - string
            - "null"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
